<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click Challenge</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: radial-gradient(circle at top, rgba(239,68,68,0.16), transparent 30%), #0f0f10;
            color: #fff;
            min-height: 100vh;
        }

        .page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 80px 24px 24px;
            position: relative;
        }

        .challenge-card {
            width: 100%;
            max-width: 760px;
            background: linear-gradient(180deg, rgba(239,68,68,0.10), rgba(255,255,255,0.02));
            border: 2px solid rgba(239,68,68,0.40);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.35);
        }

        h1 {
            margin: 0 0 24px;
            font-size: 34px;
        }

        .setup-panel {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(239,68,68,0.25);
            border-radius: 16px;
            padding: 20px;
        }

        .primary-btn,
        .secondary-btn,
        .danger-btn {
            padding: 12px 18px;
            border-radius: 12px;
            border: 1px solid transparent;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .primary-btn {
            background: rgba(239,68,68,0.18);
            color: #ffeaea;
            border-color: rgba(239,68,68,0.55);
        }

            .primary-btn:hover {
                background: linear-gradient(135deg, rgba(239,68,68,0.35), rgba(239,68,68,0.18));
                box-shadow: 0 8px 20px rgba(239,68,68,0.28);
            }

        .secondary-btn {
            background: rgba(255,255,255,0.08);
            color: #fff;
            border-color: rgba(255,255,255,0.18);
        }

        .danger-btn {
            background: rgba(239,68,68,0.18);
            color: #ffeaea;
            border-color: rgba(239,68,68,0.55);
        }

        .click-area {
            height: 320px;
            border-radius: 18px;
            margin-top: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 38px;
            font-weight: 900;
            text-align: center;
            cursor: pointer;
            user-select: none;
            border: 1px solid rgba(255,255,255,0.14);
            transition: 0.2s ease;
        }

        .idle {
            background: linear-gradient(180deg, rgba(239,68,68,0.16), rgba(239,68,68,0.06));
        }

        .wait {
            background: linear-gradient(180deg, rgba(120,120,120,0.20), rgba(255,255,255,0.04));
        }

        .go {
            background: linear-gradient(180deg, rgba(34,197,94,0.35), rgba(34,197,94,0.14));
            box-shadow: 0 0 35px rgba(34,197,94,0.35);
        }

        .too-early {
            background: linear-gradient(180deg, rgba(239,68,68,0.40), rgba(239,68,68,0.14));
            box-shadow: 0 0 35px rgba(239,68,68,0.35);
        }

        .stats {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }

        .stat-box {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 14px;
            padding: 14px;
        }

        .stat-label {
            display: block;
            color: rgba(255,255,255,0.65);
            font-size: 13px;
            margin-bottom: 6px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 800;
        }

        .result-text {
            margin-top: 18px;
            font-size: 22px;
            font-weight: 800;
            text-align: center;
            color: #ffeaea;
        }

        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 28px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #d4d4d4;
            background: transparent;
            color: #d4d4d4;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

            .close-btn:hover {
                background: #d4d4d43d;
                transform: scale(1.08);
            }

        .modal.hidden {
            display: none;
        }

        .modal {
            position: fixed;
            inset: 0;
            z-index: 9999;
        }

        .modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.6);
        }

        .modal-card {
            position: relative;
            width: min(560px, 92vw);
            max-height: 80vh;
            margin: 8vh auto 0;
            background: #1b1b1b;
            border: 1px solid #333;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.55);
            overflow: hidden;
        }

        .modal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-bottom: 1px solid #2a2a2a;
        }

            .modal-head h3 {
                margin: 0;
                font-size: 1rem;
            }

        .modal-x {
            background: transparent;
            border: none;
            color: #ddd;
            font-size: 22px;
            cursor: pointer;
            line-height: 1;
        }

        .modal-body {
            padding: 14px 16px;
            color: #eaeaea;
            overflow: auto;
            max-height: calc(80vh - 110px);
            white-space: pre-line;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            padding: 12px 16px;
            border-top: 1px solid #2a2a2a;
        }

        .modal-btn {
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #3a3a3a;
            background: #232323;
            color: #f5f5f5;
            cursor: pointer;
        }

            .modal-btn.danger {
                border-color: #7f1d1d;
                background: #3a1010;
            }

        .modal-error .modal-card {
            background: linear-gradient(180deg, #2a0f0f, #160909);
            border: 1px solid #7f1d1d;
        }

        .modal-error .modal-head {
            border-bottom: 1px solid #7f1d1d;
        }

            .modal-error .modal-head h3 {
                color: #fca5a5;
            }

        .modal-error .modal-body {
            color: #fee2e2;
        }

        @media (max-width: 700px) {
            .page {
                padding-top: 90px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .click-area {
                height: 260px;
                font-size: 30px;
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <button id="closeBtn" class="close-btn">✕</button>

        <div class="challenge-card">
            <h1>Click Challenge</h1>

            <div class="setup-panel">
                <button id="startBtn" class="primary-btn">Start Challenge</button>

                <div id="clickArea" class="click-area idle">
                    Click Start
                </div>

                <div class="stats">
                    <div class="stat-box">
                        <span class="stat-label">Reaction</span>
                        <span class="stat-value" id="reactionLabel">- ms</span>
                    </div>

                    <div class="stat-box">
                        <span class="stat-label">Animal Match</span>
                        <span class="stat-value" id="animalLabel">-</span>
                    </div>

                    <div class="stat-box">
                        <span class="stat-label">Status</span>
                        <span class="stat-value" id="statusLabel">Ready</span>
                    </div>
                </div>

                <div class="result-text" id="resultText">
                    Test your reaction speed.
                </div>

                <div class="controls">
                    <button id="restartBtn" class="danger-btn">Restart</button>
                </div>
            </div>
        </div>
    </div>

    <div id="appModal" class="modal hidden" aria-hidden="true">
        <div class="modal-backdrop" data-close="1"></div>

        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="appModalTitle">
            <div class="modal-head">
                <h3 id="appModalTitle">Title</h3>
                <button class="modal-x" type="button" data-close="1" aria-label="Close">×</button>
            </div>

            <div id="appModalBody" class="modal-body"></div>
            <div class="modal-actions" id="appModalActions"></div>
        </div>
    </div>

    <script>
        (async function () {
            const stored = localStorage.getItem("currentUser");
            if (!stored) {
                window.location.href = "/login.html";
                return;
            }
        })();


let state = "idle";
let startTime = 0;
let timeoutId = null;

const startBtn = document.getElementById("startBtn");
const restartBtn = document.getElementById("restartBtn");
const clickArea = document.getElementById("clickArea");

const reactionLabel = document.getElementById("reactionLabel");
const animalLabel = document.getElementById("animalLabel");
const statusLabel = document.getElementById("statusLabel");
const resultText = document.getElementById("resultText");

function getReactionResult(ms) {
    if (ms < 120) return "Cheetah ⚡";
    if (ms < 160) return "Cat 🐱";
    if (ms < 200) return "Snake 🐍";
    if (ms < 250) return "Fox 🦊";
    if (ms < 300) return "Human 🧍";
    if (ms < 400) return "Bear 🐻";
    return "Turtle 🐢";
}

function getReactionComment(ms) {
    if (ms < 120) return "Insane reaction speed!";
    if (ms < 160) return "Elite level reflex!";
    if (ms < 200) return "Very good reaction!";
    if (ms < 250) return "Good reaction speed.";
    if (ms < 300) return "Average human reaction.";
    if (ms < 400) return "A bit slow, try again.";
    return "Very slow, focus and retry.";
}

function resetChallenge() {
    clearTimeout(timeoutId);

    state = "idle";
    startTime = 0;

    clickArea.textContent = "Click Start";
    clickArea.className = "click-area idle";

    reactionLabel.textContent = "- ms";
    animalLabel.textContent = "-";
    statusLabel.textContent = "Ready";
    resultText.textContent = "Test your reaction speed.";

    startBtn.disabled = false;
}

function startChallenge() {
    clearTimeout(timeoutId);

    state = "waiting";

    clickArea.textContent = "WAIT...";
    clickArea.className = "click-area wait";

    reactionLabel.textContent = "- ms";
    animalLabel.textContent = "-";
    statusLabel.textContent = "Waiting";
    resultText.textContent = "Wait for green, then click as fast as possible.";

    startBtn.disabled = true;

    const delay = Math.floor(Math.random() * 3000) + 2000;

    timeoutId = setTimeout(() => {
        state = "go";
        startTime = Date.now();

        clickArea.textContent = "CLICK!";
        clickArea.className = "click-area go";
        statusLabel.textContent = "Click now";
        resultText.textContent = "GO!";
    }, delay);
}

function handleClickArea() {
    if (state === "idle") return;

    if (state === "waiting") {
        clearTimeout(timeoutId);

        state = "idle";
        clickArea.textContent = "Too Early!";
        clickArea.className = "click-area too-early";

        statusLabel.textContent = "Too Early";
        resultText.textContent = "You clicked too early. Press Start Challenge again.";
        startBtn.disabled = false;
        return;
    }

    if (state === "go") {
        const reaction = Date.now() - startTime;
        const animal = getReactionResult(reaction);
        const comment = getReactionComment(reaction);

        state = "finished";

        reactionLabel.textContent = `${reaction} ms`;
        animalLabel.textContent = animal;
        statusLabel.textContent = "Finished";

        clickArea.textContent = `${reaction} ms`;
        clickArea.className = "click-area idle";

        resultText.textContent = `${comment} You are close to: ${animal}`;
        startBtn.disabled = false;
    }
}

function uiModal({
    title = "Info",
    body = "",
    variant = "default",
    buttons = [{ text: "OK", value: true, className: "primary" }]
}) {
    const modal = document.getElementById("appModal");
    const titleEl = document.getElementById("appModalTitle");
    const bodyEl = document.getElementById("appModalBody");
    const actionsEl = document.getElementById("appModalActions");

    let resolve;
    const p = new Promise(r => (resolve = r));

    modal.classList.remove("modal-default", "modal-error", "modal-success", "modal-warning");
    modal.classList.add(`modal-${variant}`);

    const onKey = (e) => {
        if (e.key === "Escape") close(false);
    };

    const close = (val) => {
        modal.classList.add("hidden");
        modal.setAttribute("aria-hidden", "true");
        document.removeEventListener("keydown", onKey);
        resolve(val);
    };

    titleEl.textContent = title;
    bodyEl.textContent = body;
    actionsEl.innerHTML = "";

    modal.classList.remove("hidden");
    modal.setAttribute("aria-hidden", "false");
    document.addEventListener("keydown", onKey);

    modal.querySelectorAll("[data-close='1']").forEach(el => {
        el.onclick = () => close(false);
    });

    buttons.forEach(b => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `modal-btn ${b.className || ""}`.trim();
        btn.textContent = b.text || "OK";
        btn.onclick = () => close(b.value);
        actionsEl.appendChild(btn);
    });

    setTimeout(() => actionsEl.querySelector("button")?.focus(), 0);
    return p;
}

function uiConfirm(message, title = "Confirm") {
    return uiModal({
        title,
        body: message,
        variant: "error",
        buttons: [
            { text: "Cancel", value: false },
            { text: "Exit", value: true, className: "danger" }
        ]
    });
}

startBtn.addEventListener("click", startChallenge);
restartBtn.addEventListener("click", resetChallenge);
clickArea.addEventListener("click", handleClickArea);

document.getElementById("closeBtn")?.addEventListener("click", async () => {
    const ok = await uiConfirm("Exit challenge? Your current result won't be saved.", "Exit Challenge");
    if (!ok) return;
    window.location.href = "user.html";
});
    </script>
</body>
</html>
