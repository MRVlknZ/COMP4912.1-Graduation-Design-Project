<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Sound Drill - Play</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            background: #111;
            color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .frame {
            position: relative;
            width: 90vw;
            max-width: 1100px;
            height: 80vh;
            border: 3px solid #444;
            border-radius: 16px;
            padding: 24px 32px;
            background: #181818;
            display: flex;
            flex-direction: column;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
        }

        .drill-info h1 {
            font-size: 1.4rem;
            margin-bottom: 4px;
        }

        .drill-info p {
            font-size: 0.9rem;
            color: #d4d4d4;
        }

        .pill {
            border-radius: 999px;
            border: 1px solid #555;
            padding: 6px 14px;
            font-size: 0.85rem;
            text-align: right;
        }

        .center-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 24px;
        }

        .color-box {
            width: 260px;
            height: 260px;
            border-radius: 32px;
            border: 3px solid #f5f5f5;
            box-shadow: 0 18px 40px rgba(0,0,0,0.5);
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: 600;
        }

        .action-text {
            font-size: 1.4rem;
            font-weight: 600;
        }

        .meta-text {
            font-size: 0.9rem;
            color: #d4d4d4;
        }

        .bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
        }

        .btn-primary, .btn-ghost {
            border-radius: 999px;
            padding: 10px 22px;
            font-size: 0.95rem;
            cursor: pointer;
            border: none;
            transition: 0.15s ease;
        }

        .btn-primary {
            background: #e11d48;
            color: #fff;
        }

            .btn-primary:hover {
                transform: translateY(-1px);
                box-shadow: 0 12px 25px rgba(225, 29, 72, 0.35);
            }

        .btn-ghost {
            background: transparent;
            border: 1px solid #555;
            color: #f5f5f5;
        }

            .btn-ghost:hover {
                background: #262626;
            }

        .status-text {
            font-size: 0.9rem;
            color: #d4d4d4;
        }

        .close-btn {
            position: fixed;
            top: 18px;
            right: 26px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #d4d4d4;
            background: transparent;
            color: #d4d4d4;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

            .close-btn:hover {
                background: #d4d4d43d;
                transform: scale(1.08);
            }

        @media (max-width: 700px) {
            .frame {
                padding: 18px;
                height: 90vh;
            }

            .color-box {
                width: 200px;
                height: 200px;
            }
        }

        .hidden {
            display: none !important;
        }

        .modal {
            position: fixed;
            inset: 0;
            z-index: 9999;
        }

        .modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.6);
        }

        .modal-card {
            position: relative;
            width: min(560px, 92vw);
            max-height: 80vh;
            margin: 8vh auto 0;
            background: #1b1b1b;
            border: 1px solid #333;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.55);
            overflow: hidden;
        }

        .modal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-bottom: 1px solid #2a2a2a;
        }

            .modal-head h3 {
                margin: 0;
                font-size: 1rem;
            }

        .modal-x {
            background: transparent;
            border: none;
            color: #ddd;
            font-size: 22px;
            cursor: pointer;
            line-height: 1;
        }

        .modal-body {
            padding: 14px 16px;
            color: #eaeaea;
            overflow: auto;
            max-height: calc(80vh - 110px);
            white-space: pre-line;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            padding: 12px 16px;
            border-top: 1px solid #2a2a2a;
        }

        .modal-btn {
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #3a3a3a;
            background: #232323;
            color: #f5f5f5;
            cursor: pointer;
        }

            .modal-btn.primary {
                border-color: #4a4a4a;
                background: #2b2b2b;
            }

            .modal-btn.danger {
                border-color: #7f1d1d;
                background: #3a1010;
            }

        .modal-error .modal-card {
            background: linear-gradient(180deg, #2a0f0f, #160909);
            border: 1px solid #7f1d1d;
        }

        .modal-error .modal-head {
            border-bottom: 1px solid #7f1d1d;
        }

            .modal-error .modal-head h3 {
                color: #fca5a5;
            }

        .modal-error .modal-body {
            color: #fee2e2;
        }

        .modal-error .modal-x {
            color: #fecaca;
        }

        .modal-error .modal-btn.primary {
            background: #7f1d1d;
            border-color: #991b1b;
        }

            .modal-error .modal-btn.primary:hover {
                background: #991b1b;
            }
    </style>
</head>
<body>
    <div class="frame">
        <button id="closeBtn" class="close-btn">✕</button>

        <div class="top-row">
            <div class="drill-info">
                <h1 id="drillName">Loading…</h1>
                <p id="drillDesc"></p>
            </div>
            <div class="pill">
                <div>Time: <span id="elapsedLabel">0</span>s / <span id="totalLabel">0</span>s</div>
            </div>
        </div>

        <div class="center-area">
            <div class="color-box" id="colorBox">
                <span id="colorName">–</span>
            </div>
            <div class="action-text" id="actionText">Waiting…</div>
            <div class="meta-text" id="metaText"></div>
        </div>

        <div class="bottom-row">
            <div>
                <button class="btn-primary" id="btnStart">Start</button>
                <button class="btn-ghost" id="btnPause">Pause</button>
                <button class="btn-ghost" id="btnRestart">Restart</button>
            </div>
            <div class="status-text" id="statusText">Ready.</div>
        </div>
    </div>

    <div id="appModal" class="modal hidden" aria-hidden="true">
        <div class="modal-backdrop" data-close="1"></div>

        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="appModalTitle">
            <div class="modal-head">
                <h3 id="appModalTitle">Title</h3>
                <button class="modal-x" type="button" data-close="1" aria-label="Close">×</button>
            </div>

            <div id="appModalBody" class="modal-body"></div>

            <div class="modal-actions" id="appModalActions"></div>
        </div>
    </div>

    <script>
        function uiModal({
            title = "Info",
            body = "",
            variant = "default",
            buttons = [{ text: "OK", value: true, className: "primary" }]
        }) {
            const modal = document.getElementById("appModal");
            const titleEl = document.getElementById("appModalTitle");
            const bodyEl = document.getElementById("appModalBody");
            const actionsEl = document.getElementById("appModalActions");

            if (!modal || !titleEl || !bodyEl || !actionsEl) {
                console.warn("Modal DOM not found. Message:", title, body);
                return Promise.resolve(true);
            }

            let resolve;
            const p = new Promise(r => (resolve = r));

            modal.classList.remove("modal-default", "modal-error", "modal-success", "modal-warning");
            modal.classList.add(`modal-${variant}`);

            const onKey = (e) => {
                if (e.key === "Escape") close(false);
            };

            const close = (val) => {
                modal.classList.add("hidden");
                modal.setAttribute("aria-hidden", "true");
                document.removeEventListener("keydown", onKey);
                resolve(val);
            };

            titleEl.textContent = title;
            bodyEl.textContent = body;
            actionsEl.innerHTML = "";

            modal.classList.remove("hidden");
            modal.setAttribute("aria-hidden", "false");

            document.addEventListener("keydown", onKey);

            modal.querySelectorAll("[data-close='1']").forEach(el => {
                el.onclick = () => close(false);
            });

            buttons.forEach(b => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = `modal-btn ${b.className || ""}`.trim();
                btn.textContent = b.text || "OK";
                btn.onclick = () => close(b.value);
                actionsEl.appendChild(btn);
            });

            setTimeout(() => actionsEl.querySelector("button")?.focus(), 0);

            return p;
        }

        function uiAlert(message, title = "Info", variant = "default") {
            return uiModal({
                title,
                body: message,
                variant,
                buttons: [{ text: "OK", value: true, className: "primary" }]
            });
        }

        function uiConfirm(message, title = "Confirm") {
            return uiModal({
                title,
                body: message,
                variant: "error",
                buttons: [
                    { text: "Cancel", value: false },
                    { text: "Delete", value: true, className: "danger" }
                ]
            });
        }

        (async function () {
            const storedUser = localStorage.getItem("currentUser");
            if (!storedUser) {
                window.location.href = "/login.html";
                return;
            }

            let currentUser;
            try {
                currentUser = JSON.parse(storedUser);
            } catch {
                window.location.href = "/login.html";
                return;
            }

            const userId = currentUser.id ?? currentUser.Id ?? 0;
            const params = new URLSearchParams(window.location.search);
            const drillId = Number(params.get("id") || 0);

            if (!userId || !drillId) {
                await uiAlert("Drill or user not found.", "Error", "error");
                window.location.href = "/user.html";
                return;
            }

            console.log("text-drill → userId:", userId, "drillId:", drillId);

            window._textDrillId = drillId;

            await loadPreDrill(userId, drillId);
        })();

        function getSafeProp(obj, lower, upper, fallback = "") {
            return obj?.[lower] ?? obj?.[upper] ?? fallback;
        }

        const drillNameEl = document.getElementById("drillName");
        const drillDescEl = document.getElementById("drillDesc");
        const elapsedLabelEl = document.getElementById("elapsedLabel");
        const totalLabelEl = document.getElementById("totalLabel");
        const colorBoxEl = document.getElementById("colorBox");
        const colorNameEl = document.getElementById("colorName");
        const actionTextEl = document.getElementById("actionText");
        const metaTextEl = document.getElementById("metaText");
        const statusTextEl = document.getElementById("statusText");

        const btnStart = document.getElementById("btnStart");
        const btnPause = document.getElementById("btnPause");
        const btnRestart = document.getElementById("btnRestart");
        const closeBtn = document.getElementById("closeBtn");

        let drill = null;

        let commands = [];           
        let currentCmdIndex = 0;

        let totalDurationSec = 0;     
        let intervalSec = 0;           

        let elapsedTotalSec = 0;      
        let nextSpeakAt = 0;           
        let timer = null;
        let isRunning = false;

        function speak(text) {
            if (!("speechSynthesis" in window)) return false;
            try {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = "en-US";
                u.rate = 1;
                u.pitch = 1;
                window.speechSynthesis.speak(u);
                return true;
            } catch (e) {
                console.error("speak error:", e);
                return false;
            }
        }

        async function loadPreDrill(userId, drillId) {
            try {
                const listUrl = `/api/PSoundDrill/GetByUser?userId=${userId}`;
                console.log("GET", listUrl);

                const listRes = await fetch(listUrl);
                if (!listRes.ok) {
                    const txt = await listRes.text();
                    console.log("GetByUser failed:", listRes.status, txt);
                    await uiAlert("Drills could not be loaded.", "Error", "error");
                    window.location.href = "/user.html";
                    return;
                }

                const drills = await listRes.json();
                console.log("User drills:", drills);

                drill = drills.find(d => Number(d.id ?? d.Id) === Number(drillId));

                if (!drill) {
                    await uiAlert("Drill not found for this user.", "Not Found", "error");
                    window.location.href = "/user.html";
                    return;
                }

                const deletedAt = drill.deletedAt ?? drill.DeletedAt;
                if (deletedAt !== null && deletedAt !== undefined) {
                    await uiAlert("This drill has already been deleted.", "Deleted", "error");
                    window.location.href = "/user.html";
                    return;
                }

                initFromDrill(drill);
            } catch (err) {
                console.error("loadPreDrill error:", err);
                await uiAlert("Drill could not be loaded.", "Error", "error");
                window.location.href = "/user.html";
            }
        }

        function initFromDrill(d) {
            if (!d) {
                uiAlert("Drill not found.", "Not Found", "error").then(() => {
                    window.location.href = "/user.html";
                });
                return;
            }

            const name = getSafeProp(d, "name", "Name", "Pre Sound Drill");
            const desc = getSafeProp(d, "description", "Description", "Sound based drill.");
            const cmdListStr = getSafeProp(d, "voiceCommandList", "VoiceCommandList", "");
            const totalDur = Number(getSafeProp(d, "totalDurationSec", "TotalDurationSec", 0)) || 0;
            const cmdInterval = Number(getSafeProp(d, "commandIntervalSec", "CommandIntervalSec", 0)) || 0;
            const diff = getSafeProp(d, "difficultyLevel", "DifficultyLevel", "Easy");

            commands = (cmdListStr || "")
                .split(/[;,]/g)
                .map(x => x.trim())
                .filter(x => x.length > 0);

            if (!commands.length) {
                uiAlert("No valid commands defined in this drill.", "Error", "error").then(() => {
                    window.location.href = "/user.html";
                });
                return;
            }

            if (!totalDur || totalDur <= 0) {
                uiAlert("TotalDurationSec is missing/invalid.", "Error", "error").then(() => {
                    window.location.href = "/user.html";
                });
                return;
            }

            if (!cmdInterval || cmdInterval <= 0) {
                uiAlert("CommandIntervalSec is missing/invalid.", "Error", "error").then(() => {
                    window.location.href = "/user.html";
                });
                return;
            }

            totalDurationSec = Math.floor(totalDur);
            intervalSec = cmdInterval;

            elapsedTotalSec = 0;
            nextSpeakAt = 0;
            currentCmdIndex = 0;

            if (drillNameEl) drillNameEl.textContent = name;
            if (drillDescEl) drillDescEl.textContent = `${desc} • Difficulty: ${diff}`;
            if (totalLabelEl) totalLabelEl.textContent = String(totalDurationSec);
            if (elapsedLabelEl) elapsedLabelEl.textContent = "0";

            if (colorNameEl) colorNameEl.textContent = commands[0] || "–";
            if (actionTextEl) actionTextEl.textContent = "Waiting…";
            if (metaTextEl) metaTextEl.textContent = `Commands: ${commands.length} • Interval: ${intervalSec}s`;
            updateStatus("Ready. Press Start.");

            startTimer();
        }

        function updateStatus(text) {
            if (statusTextEl) statusTextEl.textContent = text;
        }

        function showCommand(cmd) {
            if (colorNameEl) colorNameEl.textContent = cmd || "–";
            if (actionTextEl) actionTextEl.textContent = "LISTEN";
            if (metaTextEl) metaTextEl.textContent = `Command ${currentCmdIndex + 1} / ${commands.length} • Every ${intervalSec}s`;
        }

        function startTimer() {
            if (!commands.length) return;

            if (timer) clearInterval(timer);

            isRunning = true;
            updateStatus("Running...");

            nextSpeakAt = 0;

            timer = setInterval(() => {
                elapsedTotalSec++;
                if (elapsedLabelEl) elapsedLabelEl.textContent = String(elapsedTotalSec);

                if (elapsedTotalSec >= totalDurationSec) {
                    stopTimer("Completed.");
                    return;
                }

                if (elapsedTotalSec >= nextSpeakAt) {
                    const cmd = commands[currentCmdIndex] || commands[0];
                    showCommand(cmd);

                    const ok = speak(cmd);
                    if (!ok) {
                        updateStatus("Running (speech not supported).");
                    }

                    if (getSafeProp(drill, "isRandomOrder", "IsRandomOrder", false)) {
                        currentCmdIndex = Math.floor(Math.random() * commands.length);
                    } else {
                        currentCmdIndex = (currentCmdIndex + 1) % commands.length;
                    }
                    nextSpeakAt = elapsedTotalSec + intervalSec;
                }

            }, 1000);
        }

        function stopTimer(message = "Stopped.") {
            if (timer) {
                clearInterval(timer);
                timer = null;
            }
            isRunning = false;
            updateStatus(message);
            try { window.speechSynthesis?.cancel?.(); } catch { }
        }

        function restartDrill() {
            stopTimer("Restarted.");
            elapsedTotalSec = 0;
            nextSpeakAt = 0;
            currentCmdIndex = 0;
            if (elapsedLabelEl) elapsedLabelEl.textContent = "0";
            if (actionTextEl) actionTextEl.textContent = "Waiting…";
            if (colorNameEl) colorNameEl.textContent = commands[0] || "–";
            startTimer();
        }

        btnStart?.addEventListener("click", () => {
            if (!isRunning) startTimer();
        });

        btnPause?.addEventListener("click", () => {
            if (isRunning) stopTimer("Paused.");
        });

        btnRestart?.addEventListener("click", () => {
            restartDrill();
        });

        closeBtn?.addEventListener("click", async () => {
            const ok = await uiConfirm("End the drill and delete it?", "End Drill");
            if (!ok) return;

            await softDeleteCurrentDrill();
            window.location.href = "/user.html";
        });

        async function softDeleteCurrentDrill() {
            const id = drill?.id ?? drill?.Id;
            if (!id) return;

            try {
                const res = await fetch(`/api/PSoundDrill/SoftDelete?id=${id}`, { method: "POST" });
                if (!res.ok) {
                    const txt = await res.text();
                    console.error("SoftDelete failed:", res.status, txt);
                }
            } catch (err) {
                console.error("SoftDelete error:", err);
            }
        }

    </script>
</body>
</html>
